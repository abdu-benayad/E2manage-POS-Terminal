# egui_kittest snapshot comparison config, read by the `image-snapshots` feature.
#
# ── This number is measured here. Do not copy one in, and do not copy this one out. ──
#
# A pixel threshold is a property of the *pictures it guards*, not of the tool. The file that
# stood here until 2026-08-25 was a byte-identical copy of `abdu-egui-ui`'s, carrying its 50 and
# its prose — including citations to `src/text/mark_acuity_probe.rs` and `src/text/paint.rs`,
# which are files in that repository and have never existed in this one. Its 50 was calibrated
# against ~300 text-heavy references. This corpus has six.
#
# ── The bracket, measured 2026-08-25 on this machine, lavapipe (Mesa software Vulkan) ──
#
#   floor   0 counted pixels.  Two consecutive renders of all six references are byte-identical,
#                              and re-comparing at `failed_pixel_count_threshold = 0` passes — so
#                              the zero is the comparator's, not just `md5sum`'s.
#   break 244 counted pixels.  `Reading::is_rtl` forced to `false` — the layout mirror stops
#                              while the text stays Arabic, which is exactly the regression class
#                              these references exist to catch. The three RTL references diverged
#                              by 244 (operators), 81,546 (pairing) and 234,107 (pin entry); the
#                              three LTR ones correctly did not move at all.
#
# 20 sits an order of magnitude below the smallest break and absorbs roughly three times the
# worst cross-Mesa glyph drift the sibling repo has observed (6 counted pixels over ~300
# references). `threshold` stays at kittest's default.
#
# ── What the floor above does NOT establish ──
#
# It is a *same-machine, same-driver* zero. The drift this knob exists to absorb appears between
# Mesa **versions**, and one machine cannot sample that. So the lower bracket is an assumption
# borrowed from the sibling repo's measurement, not a reading taken here, and the first CI host
# or driver bump is the real measurement. If these six start failing together with small counts,
# that is the floor arriving — raise this number and record the new reading; do not regenerate the
# references, which only moves the drift to the next version.
#
# ── Two properties of the comparator worth knowing before trusting any number above ──
#
#   * The counts are *post-antialias-discard*. `egui_kittest` passes
#     `detect_anti_aliased_pixels = true` to dify, hardcoded and unreachable from this file, so
#     pixels dify classifies as antialiased are never counted.
#   * Consequently this instrument is blind to anything made entirely of antialiased edge. A
#     glyph mark displaced two pixels lands under any usable floor. Such a defect needs an
#     assertion, not a reference image.
#
# ── The file is kept even though it holds one line of configuration ──
#
# kittest's config search walks to the filesystem root with no workspace boundary. Delete this
# and the crate silently inherits whichever ancestor directory happens to hold a `kittest.toml` —
# `/home/abdu/Downloads/abdu-egui-ui`'s, among others — and nothing reports which one was used.

[linux]
failed_pixel_count_threshold = 20
