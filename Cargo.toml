# ============================================================================
# E2Manage POS Terminal - Workspace Root
# ============================================================================

[workspace]
resolver = "2"
members = [
    "crates/pos-models",
    "crates/pos-escpos",
    "crates/pos-db",
    "crates/pos-api",
    "crates/pos-printing",
    "crates/pos-services",
]

# `pos-updater` sits in `crates/` but is deliberately not a member. It pulls
# reqwest 0.11 with default features, so it links native-tls and needs system
# OpenSSL headers, which the rest of the workspace does not. Making it a member
# would put that requirement on every clone. Declared here rather than left as a
# commented-out member: without an entry on either list, cargo refuses to build
# it standalone too, so it could not be built by any command at all.
#
#     cd crates/pos-updater && cargo build     # builds `pos-launcher`

# `pos-contract` is excluded for the same kind of reason, measured rather than
# assumed: `pact_consumer` with default features off resolves 80 crates the rest
# of the till does not vendor — a 32% increase on a 253-crate tree — and among
# them `onig_sys`, which compiles Oniguruma from C source. `pact_matching` and
# `pact_models` both depend on it and neither makes it optional. Nothing in the
# workspace depends on `pos-contract`, so none of that has to be anyone's
# problem; membership would make it everyone's. It is also outside the
# vendored-offline discipline on purpose and needs network to build.
#
#     cd crates/pos-contract && cargo test    # writes pacts/*.json
exclude = ["crates/pos-updater", "crates/pos-contract"]

# The main terminal binary
default-members = ["."]

[package]
name = "e2manage-pos-terminal"
version = "0.1.0"
edition = "2021"
description = "Open-source POS Terminal for E2Manage ERP"
license = "MIT"
repository = "https://github.com/e2manage/e2manage-pos-terminal"
homepage = "https://e2manage.com"
readme = "README.md"
keywords = ["pos", "point-of-sale", "retail", "erp"]
categories = ["gui", "embedded"]
authors = ["E2Manage Team"]

# ============================================================================
# THE BINARY
# ============================================================================
#
# The workspace's only `[[bin]]`. It lives on the root package rather than in a
# new excluded crate, decided in `egui-auth-screen` task 11: an excluded crate is
# invisible to every `--workspace` command, does not inherit the profiles below,
# and would need its own `.gitignore` and verification wiring — which is
# rebuilding by hand what membership gives for free. `pos-contract` sat red
# through five consecutive task verifications for exactly that reason.

[[bin]]
name = "e2manage-pos"
path = "src/main.rs"

# ============================================================================
# WORKSPACE DEPENDENCIES (shared versions)
# ============================================================================

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Error Handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"

# Decimal Numbers (for currency)
rust_decimal = { version = "1", features = ["serde", "serde-with-float"] }

# Synchronization
parking_lot = "0.12"

# Secret material — zeroizing PIN buffers on drop.
# `zeroize_derive` is deliberately absent: it is not vendored, so `Drop` is written by hand.
zeroize = "1"

# HTTP mocking, test-only.
# `ApiClient` is a concrete `reqwest` struct on purpose: `new` takes a base URL, so a mock
# server bound to 127.0.0.1 is reachable without a trait. A trait with one production
# implementation would test a fake instead of the transport boundary where the defects are.
wiremock = "0.6"

# Internal crates
pos-models = { path = "crates/pos-models" }
pos-escpos = { path = "crates/pos-escpos" }
pos-db = { path = "crates/pos-db" }
pos-api = { path = "crates/pos-api" }
pos-printing = { path = "crates/pos-printing" }
pos-services = { path = "crates/pos-services" }

# ============================================================================
# MAIN BINARY DEPENDENCIES
# ============================================================================

[dependencies]
# Internal crates
pos-models.workspace = true
pos-escpos.workspace = true
pos-db.workspace = true
pos-api.workspace = true
pos-printing.workspace = true
pos-services.workspace = true

# Available backends: backend-qt, backend-winit, backend-linuxkms

# Async Runtime
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }

# Re-exports from internal crates
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
rust_decimal.workspace = true
parking_lot.workspace = true

# Logging subscriber (only needed in main binary)
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# File-based logging with rotation
tracing-appender = "0.2"

# The database's own error type, so `StartupFailure` can carry a `#[source]` rather than a string.
#
# `pos-db` exposes `SqliteResult<T> = rusqlite::Result<T>` and re-exports no part of `rusqlite`, so
# any caller that handles one of its failures has to name the crate. Pinned identically to
# `crates/pos-db/Cargo.toml` — same version, same features — for the reason recorded there: a bare
# `rusqlite = "0.32"` resolves without `bundled`, and two feature sets would compile two SQLites.
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }

# System Directories
directories = "5"

# Lazy Initialization
once_cell = "1"

# ============================================================================
# PLATFORM-SPECIFIC DEPENDENCIES
# ============================================================================

[target.'cfg(windows)'.dependencies]
serialport = { version = "4", optional = true }

[target.'cfg(unix)'.dependencies]
serialport = { version = "4", optional = true }

# ============================================================================
# FEATURES
# ============================================================================

# ============================================================================
# VIEW LAYER
# ============================================================================
#
# `abdu-egui-ui` is `publish = false` in a separate private repository, so this is
# a path dependency and the binary builds only where that checkout sits beside
# this one. See `doc/building.md`. The condition that retires it is the library
# publishing; nothing else does.
#
# `default-features = false` on both `egui` and `eframe` is load-bearing and not
# a size preference. Cargo unions features across the single resolved `egui`, so
# defaults here would switch `default_fonts` back on for the whole graph — the
# library's own compilation included — silently undoing its font decision and
# adding 1,414,020 bytes of faces that nothing draws. `abdu-egui-ui/docs/fonts.md`
# has the measurement.
#
# `accesskit` is taken back deliberately. The library's own `preview` eframe line
# omits it, and that omission is preview-specific: without the adapter the build
# constructs the egui accessibility tree and pushes it nowhere, which is silent to
# a screen reader. This screen's testing contract is AccessKit assertions, so
# dropping it would throw the tree away at the last hop and every test would still
# pass.
#
# `0.34` must match the library's line exactly. A 0.x mismatch is not unified by
# cargo and yields two incompatible `egui` copies, surfacing as type errors passing
# `&mut Ui` across the boundary.
abdu-egui-ui = { path = "../abdu-egui-ui" }
egui = { version = "0.34", default-features = false }
eframe = { version = "0.34", default-features = false, features = [
    "accesskit",
    "glow",
    "wayland",
    "x11",
] }

[features]
default = []
hardware = ["serialport"]
# Image-snapshot tests need a wgpu renderer (GPU or software), unavailable headless
# by default. Declared HERE and not only on the component library: a feature is
# selected on the crate under test, so `cargo test -p e2manage-pos-terminal
# --features image-snapshots` fails with "none of the selected packages contains
# these features" without this line, and never reaches a test. Logic and AccessKit
# tests run without it.
image-snapshots = [
    "egui_kittest/wgpu",
    "egui_kittest/snapshot",
    # Forwarded, not merely enabled here: the testing crate gates its own snapshot helpers
    # behind this name, and without the forward `snapshot_each_direction` and friends are
    # simply absent from its public surface — an unresolved-import error rather than a
    # missing-feature one, which reads as the wrong problem.
    "abdu-egui-ui-testing/image-snapshots",
]
encrypted-db = []
face-recognition = []

# ============================================================================
# PROFILES
# ============================================================================

[profile.dev]
opt-level = 0
incremental = true
codegen-units = 16
debug = 1
split-debuginfo = "unpacked"

# Fast release builds (use for development/testing)
[profile.release]
opt-level = 3
lto = "thin"           # Thin LTO - much faster than full, still good optimization
codegen-units = 16     # Parallel codegen - uses all cores
strip = true

# Production builds - smallest/fastest binary but SLOW compilation (~40+ min)
[profile.release-prod]
inherits = "release"
opt-level = 3
lto = true             # Full LTO - slow but smallest binary
codegen-units = 1      # Single codegen unit - slow but best optimization
strip = true

[profile.release-small]
inherits = "release-prod"
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# ============================================================================
# DEV DEPENDENCIES
# ============================================================================


[dev-dependencies]
tempfile = "3"
urlencoding = "2.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Drives the screen through AccessKit assertions and image snapshots. Matches the
# library's `0.34` line; `kittest.toml` beside this manifest carries the comparison
# tolerance and the reasoning for it.
egui_kittest = "0.34"

# The component library's RTL and snapshot vocabulary, published as its own workspace member.
#
# `abdu-egui-ui`'s `src/test_support.rs` is a `#[cfg(test)] mod` whose items are `pub(crate)`, so
# it ships in no artifact and a consumer cannot reach it. This crate is what a consumer gets
# instead, and using it retires the "write a thin local helper" instruction this task carried:
# that instruction's premise was that no public surface existed, and it now does.
#
# Two things it does that a hand-rolled harness here would not have:
#
#   - every harness calls `TextEngine::validate` at construction and panics if no face resolved
#     for a text role. Without it the shaper resolves nothing, every widget paints blank, and the
#     AccessKit assertions below still pass — a green suite over a screen with no text on it.
#   - `wgpu_builder` keeps one renderer resident for the test process. A fresh wgpu instance per
#     harness races the Vulkan loader's ICD unload and kills the process with SIGSEGV under
#     parallel tests, which reads as a lavapipe flake and is not one.
abdu-egui-ui-testing = { path = "../abdu-egui-ui/abdu-egui-ui-testing" }
