[package]
name = "pos-services"
version = "0.1.0"
edition = "2021"
description = "Business logic services for E2Manage POS Terminal"
license = "MIT"
authors = ["E2Manage Team"]

[dependencies]
pos-models.workspace = true
pos-db.workspace = true
pos-api.workspace = true
pos-printing.workspace = true

# Async Runtime
# rt-multi-thread is required because update_service::install_update calls
# tokio::task::block_in_place, which is gated behind that feature.
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread"] }

# Serialization
serde.workspace = true
serde_json.workspace = true

# Date/Time
chrono.workspace = true

# UUID
uuid.workspace = true

# Error Handling
thiserror.workspace = true
anyhow.workspace = true

# Logging
tracing.workspace = true

# Synchronization
parking_lot.workspace = true

# Random (for generating IDs)
rand = "0.8"
# Password hashing
bcrypt = "0.16"

# Database (matching pos-db version)
rusqlite = { version = "0.32", features = ["bundled"] }

# System info
hostname = "0.4"

# Directories (for log location)
directories = "5"

# ZIP archive for log export
zip = { version = "2.1", default-features = false, features = ["deflate"] }

# URL encoding for support links
urlencoding = "2.1"

# Decimal Numbers (for currency)
rust_decimal.workspace = true

# ESC/POS printing
pos-escpos.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
