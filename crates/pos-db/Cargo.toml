[package]
name = "pos-db"
version = "0.1.0"
edition = "2021"
description = "SQLite database layer for E2Manage POS Terminal"
license = "MIT"
authors = ["E2Manage Team"]

[dependencies]
pos-models.workspace = true

# Database
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }

# Serialization
serde.workspace = true
serde_json.workspace = true

# Date/Time
chrono.workspace = true

# UUID
uuid.workspace = true

# Error Handling
thiserror.workspace = true
anyhow.workspace = true

# Logging
tracing.workspace = true

parking_lot.workspace = true

# Decimal Numbers (for currency)
rust_decimal.workspace = true

[dev-dependencies]
tempfile = "3"

# An integration test under `tests/` links `pos-db` as an external crate, and `lib.rs` re-exports
# no `rusqlite`, so the normal dependency above does not make `rusqlite::` nameable there.
# Pinned identically to it on purpose: a bare `rusqlite = "0.32"` resolves without `bundled` and
# builds a second copy of SQLite from source.
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
