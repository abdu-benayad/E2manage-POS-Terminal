[package]
name = "pos-contract"
version = "0.1.0"
edition = "2021"
description = "Consumer-driven contract the till holds the E2Manage platform to"
license = "MIT"
authors = ["E2Manage Team"]
publish = false

[dependencies]

[dev-dependencies]
# The till's own transport types. The contract is written against the real
# deserialisation targets, not a restatement of them: if `ApiErrorResponse`
# changes, this test stops compiling, which is the point.
pos-api = { path = "../pos-api" }

# The domain vocabulary the transport DTOs are written in. Costs nothing in the
# resolve — `pos-api` already depends on it — and it is how every other consumer
# names these types (`pos-services/src/pairing_service.rs:17`,
# `pos-services/src/auth_service.rs:14`) rather than through a re-export.
pos-models = { path = "../pos-models" }

# `default-features = false` drops plugins, tls, xml, multipart and colour.
# Do not restore them — `plugins` alone pulls the plugin driver, prost and tonic.
pact_consumer = { version = "1.4.10", default-features = false }

# rustls rather than native TLS, deliberately: it is what keeps this crate from
# acquiring `pos-updater`'s system-OpenSSL-headers requirement.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
